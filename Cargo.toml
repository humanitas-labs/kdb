[package]
name = "kdb"
version = "2.0.0-dev"
edition = "2024"
description = "Markdown link graph, task tracker, and LSP for a knowledge workspace"
license = "MIT"

# Installed as `kdb2` until parity with the v1 `kdb` binary; rename at merge.
[[bin]]
name = "kdb2"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ignore = "0.4"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tower-lsp = "0.20"
tree-sitter = "0.26"
tree-sitter-md = { version = "0.5", features = ["parser"] }

[dev-dependencies]
tempfile = "3"
